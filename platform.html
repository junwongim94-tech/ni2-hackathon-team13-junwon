<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOPIA | Pharma SOP Intelligence</title>
<meta name="description" content="회사 SOP와 대한민국약전(KP) 시험법을 비교하고 KP 개정 영향을 관리하는 SOPIA 시제품">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 56'%3E%3Cpath fill='%23003F98' d='M13 37 L8 53 L26 41 Z'/%3E%3Cpath fill='%23003F98' d='M18 13 H31 V43 H18 A15 15 0 0 1 18 13 Z'/%3E%3Cpath fill='%238DC31E' d='M33 13 H46 A15 15 0 0 1 46 43 H33 Z'/%3E%3Crect fill='%23fff' x='11' y='21' width='15' height='2.8' rx='1.4'/%3E%3Crect fill='%23fff' x='9' y='26.6' width='18' height='2.8' rx='1.4'/%3E%3Crect fill='%23fff' x='11' y='32.2' width='11' height='2.8' rx='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* SOPIA 디자인 토큰 · MVP 라이트 모드 고정 */
:root{
  color-scheme:light;
  --navy:#003F98;--navy-hover:#00347D;--green:#8DC31E;--green-text:#4C7A0C;
  --bg:#F5F7FB;--canvas:#E8ECF2;--surface:#FFFFFF;--text:#111D33;--text-sub:#59657A;--border:#DCE2EC;
  --ai-bg:#EBF0F8;--user-bg:#F0F2F5;--lime-bg:#F1F7E4;
  --s-match:#1F7A4D;--s-match-bg:#E6F4EC;
  --s-diff:#B54708;--s-diff-bg:#FFF0E3;
  --s-miss:#B42318;--s-miss-bg:#FDECEA;
  --s-review:#8A6100;--s-review-bg:#FFF6D6;
  --s-na:#59657A;--s-na-bg:#EEF1F5;
  --font-brand:"Outfit","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:14px;--shadow:0 1px 2px rgba(17,29,51,.04),0 6px 18px rgba(17,29,51,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:.86em}
.sub{color:var(--text-sub)}
.small{font-size:13px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* 레이아웃 */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;padding:4px 8px}
.logo svg{width:38px;height:auto;flex:none}
.logo .word{font-family:var(--font-brand);font-weight:800;font-size:25px;letter-spacing:-.01em;line-height:1}
.logo .word b{color:var(--navy);font-weight:800}.logo .word i{color:var(--green);font-style:normal}
.logo small{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-sub);margin-top:4px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:2px}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--text-sub);text-decoration:none;font-size:14px;font-weight:500}
.menu a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menu a:hover{background:var(--user-bg);color:var(--text)}
.menu a.active{background:var(--ai-bg);color:var(--navy);font-weight:600}
.menu a.active::before{content:"";width:3px;height:18px;border-radius:2px;background:var(--green);margin-left:-10px;margin-right:-3px}
.menu .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--s-miss);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:12px;color:var(--text-sub);border-top:1px solid var(--border);padding-top:12px;display:grid;gap:6px}
.side-foot a{font-weight:600;text-decoration:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top h1{font-size:19px;font-weight:700}
.top .crumb{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--text-sub);text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--text-sub);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#C6CEDA}
.chip.demo{border-color:#E9D9A6;background:var(--s-review-bg);color:var(--s-review)}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-sub)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;background:var(--s-miss);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 12px 3px 4px;white-space:nowrap}
.user-chip .av{width:28px;height:28px;border-radius:50%;background:var(--ai-bg);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px}
.menu-toggle{display:none}
.view{padding:24px 28px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start;max-width:1280px;width:100%}
.view>*,.grid>*{min-width:0}

/* 공통 컴포넌트 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2{font-size:17px;font-weight:700}
.card-head p{font-size:13px;color:var(--text-sub);margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--user-bg)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-hover)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:13px;border-radius:12px;padding:11px 14px;background:var(--s-review-bg);color:#5C4300;border:1px solid #EEDDA8}
.notice.info{background:var(--ai-bg);color:#183A6B;border-color:#D3DFF0}
.notice b{white-space:nowrap}
input[type=text],input[type=search],select,textarea{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:9px 12px;font-size:14px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:#9DB4DA;box-shadow:0 0 0 3px rgba(0,63,152,.09)}
label.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--text)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#F8FAFC;text-align:left;font-weight:600;color:var(--text-sub);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFBFD}
tr.sel td{background:var(--ai-bg)!important}
.empty{text-align:center;padding:36px 16px;color:var(--text-sub);display:grid;gap:10px;justify-items:center}

/* 상태 배지 */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px 2px 7px;white-space:nowrap}
.st::before{font-size:11px;line-height:1}
.st.match{color:var(--s-match);background:var(--s-match-bg)}.st.match::before{content:"✓"}
.st.diff{color:var(--s-diff);background:var(--s-diff-bg)}.st.diff::before{content:"≠"}
.st.miss{color:var(--s-miss);background:var(--s-miss-bg)}.st.miss::before{content:"!"}
.st.review{color:var(--s-review);background:var(--s-review-bg)}.st.review::before{content:"?"}
.st.na{color:var(--s-na);background:var(--s-na-bg)}.st.na::before{content:"–"}
.pri{font-size:12px;font-weight:600}
.pri.high{color:var(--s-miss)}.pri.mid{color:var(--s-review)}.pri.low{color:var(--text-sub)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--user-bg);color:var(--text-sub)}
.tag.green{background:var(--lime-bg);color:var(--green-text)}
.tag.navy{background:var(--ai-bg);color:var(--navy)}
.cite{font-family:var(--font-mono);font-size:12px;color:var(--green-text)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:grid;gap:4px;box-shadow:var(--shadow)}
.kpi span{font-size:12.5px;color:var(--text-sub);display:flex;align-items:center;gap:6px}
.kpi b{font-family:var(--font-brand);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* 차트 */
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.legend{display:grid;gap:7px;font-size:13px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:12px}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.bar-track{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--s-na-bg)}
.bar-track span{display:block;height:100%}

/* 업로드 */
.drop{border:1.5px dashed #B9C6DA;border-radius:14px;background:#FAFBFD;padding:28px 16px;text-align:center;display:grid;gap:8px;justify-items:center;transition:background .15s,border-color .15s}
.drop.over{background:var(--ai-bg);border-color:var(--navy)}
.drop svg{width:34px;height:34px;fill:none;stroke:var(--navy);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-size:15px}
.file-list{display:grid;gap:6px}
.file-item{display:flex;align-items:center;gap:10px;font-size:13px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface)}
.file-item .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .state{margin-left:auto;font-size:12px;white-space:nowrap}

/* SOP 상세 */
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.meta div{background:#F8FAFC;border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.meta span{display:block;font-size:11.5px;color:var(--text-sub)}
.meta b{font-size:14px}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sec{border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13.5px}
.sec h4{font-size:12.5px;color:var(--navy);margin-bottom:4px}
.sec.none{color:var(--text-sub);background:#FAFBFD}
.raw{white-space:pre-wrap;font-size:13px;line-height:1.7;background:#FAFBFD;border:1px solid var(--border);border-radius:10px;padding:12px 14px;max-height:340px;overflow:auto}
.raw mark{background:#FFE9A8;border-radius:3px;padding:0 2px}
.raw mark.flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:#FFC94D}100%{background:#FFE9A8}}
.timeline{display:grid;gap:0;font-size:13px}
.timeline div{display:grid;grid-template-columns:70px 96px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.timeline div:last-child{border-bottom:0}

/* 비교 */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--text-sub)}
.filters button[aria-pressed="true"]{background:var(--ai-bg);border-color:#BCCDE6;color:var(--navy);font-weight:600}
.side-by-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.pane{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pane h4{font-size:12.5px;padding:9px 13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pane.sop h4{background:var(--user-bg)}
.pane.kp h4{background:var(--lime-bg);color:var(--green-text)}
.pane .body{padding:12px 13px;font-size:14px;line-height:1.7;min-height:64px}
.num-ok{background:var(--s-match-bg);color:var(--s-match);font-weight:700;border-radius:4px;padding:0 3px}
.num-diff{background:var(--s-diff-bg);color:var(--s-diff);font-weight:700;border-radius:4px;padding:0 3px;text-decoration:underline wavy;text-underline-offset:3px}
.evidence{background:var(--lime-bg);border:1px solid #DCEBC0;border-radius:12px;padding:12px 14px;font-size:13px;display:grid;gap:5px}
.evidence.none{background:var(--s-na-bg);border-color:var(--border);color:var(--text-sub)}
.detail-status{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.detail-status.match{background:var(--s-match-bg)}.detail-status.diff{background:var(--s-diff-bg)}.detail-status.miss{background:var(--s-miss-bg)}.detail-status.review{background:var(--s-review-bg)}.detail-status.na{background:var(--s-na-bg)}
.steps{display:grid;gap:8px;font-size:13.5px}
.steps div{display:flex;gap:10px;align-items:center;color:var(--text-sub)}
.steps div::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex:none}
.steps div.on{color:var(--text)}
.steps div.on::before{border-color:var(--navy);border-top-color:transparent;animation:spin .8s linear infinite}
.steps div.done{color:var(--text)}
.steps div.done::before{background:var(--green);border-color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
.check-list{display:grid;gap:8px}
.check-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px}
.check-item input{margin-top:4px;accent-color:var(--navy)}

/* 알림 */
.alert-card{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.alert-card.unread{border-color:#B9C8DE}
.alert-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#F8FAFC;border-bottom:1px solid var(--border);flex-wrap:wrap}
.alert-head b{font-size:13px}
.alert-body{padding:14px 16px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--text-sub)}
.kv dd{margin:0}
.before-after{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.before-after div{border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid var(--border)}
.before-after div:first-child{background:var(--user-bg)}
.before-after div:last-child{background:var(--lime-bg)}
.before-after span{display:block;font-size:11.5px;font-weight:700;color:var(--text-sub);margin-bottom:2px}
.flow{display:flex;gap:4px;flex-wrap:wrap}
.flow span{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--s-na-bg);color:var(--text-sub)}
.flow span.on{background:var(--navy);color:#fff}
.flow span.past{background:var(--ai-bg);color:var(--navy)}

/* 보고서 */
.report{display:grid;gap:18px}
.report section{display:grid;gap:8px}
.report h3{font-size:15px;color:var(--navy);display:flex;gap:8px;align-items:baseline}
.report h3 span{font-family:var(--font-mono);font-size:12px;color:var(--text-sub)}
.report-cover{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--navy);padding-bottom:14px;flex-wrap:wrap}
.sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sign div{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;min-height:68px}
.sign span{display:block;font-size:11.5px;color:var(--text-sub)}

.back-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-bar .btn{border-color:#BCCDE6;color:var(--navy)}
table.stats .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.stats tr.total td{background:#F8FAFC}
table.stats tr.muted td{color:var(--text-sub)}
.cell{display:inline-block;min-width:24px;text-align:center;font-weight:700;border-radius:6px;padding:0 6px}
.cell.match{background:var(--s-match-bg);color:var(--s-match)}.cell.diff{background:var(--s-diff-bg);color:var(--s-diff)}.cell.miss{background:var(--s-miss-bg);color:var(--s-miss)}.cell.review{background:var(--s-review-bg);color:var(--s-review)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:100;box-shadow:0 8px 24px rgba(17,29,51,.2);max-width:calc(100% - 32px)}
.scrim{display:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(17,29,51,.18)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(17,29,51,.3);z-index:50}
  .menu-toggle{display:grid}
  .top{padding:12px 16px}
  .view{padding:18px 16px 40px}
  .g2,.g3,.side-by-side,.before-after,.sections{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .chip.link,.user-chip .nm{display:none}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-row{grid-template-columns:minmax(0,1fr)}.sign{grid-template-columns:minmax(0,1fr)}.top .status-chip{display:none}}
/* 맨 위로 이동 버튼 (메인 화면과 같은 모양) */

  let title=grab(/(?:제\s*목|문서\s*명|Title)\s*[:：]\s*(.+)/i);
  if(!title){title=(lines.find(l=>l.trim().length>3&&!/[:：]/.test(l))||filename).trim().slice(0,60)}
  const rev=grab(/(?:개정\s*번호|개정|Rev(?:ision)?\.?)\s*[:：]?\s*((?:Rev\.?\s*)?\d+(?:\.\d+)?)/i);
  const eff=grab(/(?:시행\s*일(?:자)?|Effective\s*Date)\s*[:：]?\s*(\d{4}[.\-/]\s?\d{1,2}[.\-/]\s?\d{1,2})/i).replace(/[./]\s?/g,'-');

function valOk(spec,n){return spec.min!=null?(n>=spec.min&&n<=spec.max):Math.abs(n-spec.v)<1e-9}

function compareSop(sop,kpKey){
  const kp=KP[kpKey];const rules=RULES[kpKey]||[];
  const sentences=splitSentences(sop.raw).filter(s=>!/^(문서\s*번호|제\s*목|개정\s*번호|시행\s*일)/.test(s));
  const rows=[];
  ITEMS.forEach(it=>{
    const rs=rules.filter(r=>r.item===it.k);
    if(!rs.length){rows.push({item:it.k,label:it.n,status:'na',kp:'',sop:'',note:'선택한 KP 시험법에 이 항목의 별도 요구사항이 등록되어 있지 않습니다.',kind:'',evidence:null,priority:'low'});return}
    rs.forEach(r=>{
      const hits=sentences.filter(s=>r.kw.some(k=>s.toLowerCase().includes(k.toLowerCase())));
      const sopText=hits.join(' / ');
      let status,note,kind='';
      if(r.mode==='presence'){
        if(hits.length){status='match';note='SOP에서 해당 요구사항이 확인됩니다.';kind=hits.some(h=>h.replace(/\s/g,'')===r.kp.replace(/\s/g,''))?'':'문구 차이 (조건 동일)'}

      }else if(r.mode==='context'){
        status='review';note=hits.length?'관련 문장은 있으나 적용 조건(각조·허가사항·검액 특성)에 따라 판단이 필요합니다.':'관련 문장이 없습니다. 이 품목에 해당하는 조건인지 확인이 필요합니다.';
      }else{
        if(!hits.length){status='miss';note='SOP에서 이 조건을 다루는 문장을 찾지 못했습니다.'}

          else if(unknown){status='review';note=parts.join(' · ')}
          else{status='match';kind='문구 차이 (조건 동일)';note='수치·단위가 KP 기준과 같습니다. 표현 차이는 판정에 반영하지 않았습니다.'}
        }
      }
      rows.push({item:it.k,label:`${it.n} · ${r.label}`,status,kp:r.kp,sop:sopText,note,kind,vals:r.vals||[],
        evidence:{doc:KP_EDITION,section:kp.section,page:kp.page,code:kp.id,quote:r.kp},

async function handleFiles(files){
  for(const f of files){
    const ext=(f.name.split('.').pop()||'').toUpperCase();const entry={name:f.name,ext,msg:'읽는 중…',ok:null};uploadLog.unshift(entry);rerender();
    try{
      const text=(await extractText(f)).trim();
      if(text.length<10)throw new Error('본문 텍스트를 찾지 못했습니다(스캔 이미지일 수 있음)');
      const d=parseSop(text,f.name);
      const prev=S.sops.find(s=>s.docNo===d.docNo);
      if(prev){d.history=[...prev.history.length?prev.history:[{rev:prev.rev,date:prev.effective,note:'이전 등록본'}],{rev:d.rev,date:d.effective,note:`새 버전 업로드 (${f.name})`}];d.id=prev.id;S.sops[S.sops.indexOf(prev)]=d;entry.msg=`기존 ${d.docNo} 개정본으로 갱신`}
      else{d.history=[{rev:d.rev,date:d.effective,note:`업로드 (${f.name})`}];S.sops.unshift(d);entry.msg=`등록 완료 · ${d.method?KP[d.method].name+' 매칭':'KP 자동 매칭 없음'}`}
      entry.ok=true;openSop=d.id;save();
    }catch(e){entry.ok=false;entry.msg='실패: '+e.message}
    rerender();
  }
}

function markNums(text,vals,isKp){
  let s=esc(text);if(!vals||!vals.length)return s;
  UNIT_RE.lastIndex=0;
  return s.replace(UNIT_RE,(m,nums,u)=>{const unit=normUnit(u);const specs=vals.filter(v=>v.u===unit);if(!specs.length)return m;
    if(isKp)return `<span class="num-ok">${m}</span>`;
    const ns=(nums.match(/\d+(?:\.\d+)?/g)||[]).map(Number);const ok=ns.some(n=>specs.some(sp=>valOk(sp,n)));
    return `<span class="${ok?'num-ok':'num-diff'}">${m}</span>`});
}

   <section><h3><span>03</span>비교 분석 개요</h3><p>총 ${a.rows.filter(r=>r.status!=='na').length}개 항목을 비교했습니다. 일치 ${c.match}, 차이 ${c.diff}, 누락 의심 ${c.miss}, 추가 검토 ${c.review}, 해당 없음 ${c.na}입니다. 수치·단위가 같으면 표현이 달라도 ‘일치(문구 차이)’로, 수치가 다르면 ‘차이(실제 조건 차이)’로 분류했습니다.</p>${donut(c)}</section>
   <section><h3><span>04</span>시험 항목별 비교 결과</h3><div class="table-wrap"><table><thead><tr><th>항목</th><th>상태</th><th>판단 근거</th></tr></thead><tbody>${a.rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${badge(r.status)}</td><td class="small">${esc(r.note)}</td></tr>`).join('')}</tbody></table></div></section>
   <section><h3><span>05</span>차이점 및 누락 의심 항목</h3>${issues.length?`<div class="table-wrap"><table><thead><tr><th>항목</th><th>SOP</th><th>KP</th><th>상태</th></tr></thead><tbody>${issues.map(r=>`<tr><td>${esc(r.label)}</td><td class="small">${esc(r.sop||'해당 문장 없음')}</td><td class="small">${esc(r.kp)}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">차이·누락 의심 항목이 없습니다.</p>'}</section>
   <section><h3><span>06</span>관련 KP 원문 및 근거 위치</h3><div class="table-wrap"><table><thead><tr><th>항목</th><th>KP 요약 발췌</th><th>근거 위치</th></tr></thead><tbody>${a.rows.filter(r=>r.status!=='na').map(r=>`<tr><td>${esc(r.label)}</td><td class="small">${esc(r.kp||'')}</td><td class="cite">${r.evidence?`${esc(r.evidence.section)} · ${esc(r.evidence.page)}`:'근거 확인 불가'}</td></tr>`).join('')}</tbody></table></div><p class="small sub">KP 내용은 시연용 요약 발췌입니다. 원문과 대조가 필요합니다.</p></section>
   <section><h3><span>07</span>검토 우선순위</h3><ol style="margin:0;padding-left:1.2em;display:grid;gap:4px">${[...issues,...reviews].map(r=>`<li><span class="pri ${r.priority}">[${PRI[r.priority]}]</span> ${esc(r.label)} — ${STATUS[r.status].t}</li>`).join('')||'<li>우선 검토 항목 없음</li>'}</ol></section>

    <textarea id="opinion" placeholder="QA 검토 의견을 입력하세요" ${isQA?'':'disabled'} aria-label="최종 검토 의견">${esc(a.opinion)}</textarea>

   </section>
   <p class="small sub">이 보고서는 참고 및 검토 보조 자료입니다. 최종 SOP 변경과 승인 권한은 QA 담당자에게 있습니다.</p>
  </div>`;
}

/* =========================================================
   9. 라우팅과 이벤트
   ========================================================= */
const VIEWS={dashboard:vDashboard,sops:vSops,kp:vKp,analyze:vAnalyze,results:vResults,alerts:vAlerts,report:vReport,settings:vSettings};
function route(){const h=location.hash.slice(1);return VIEWS[h]?h:'dashboard'}
let lastRoute=null;
function rerender(){
  const r=route();renderChrome(r);const v=$('#view');const keep=r===lastRoute?window.scrollY:0;
  v.innerHTML=VIEWS[r]();
  if(r!==lastRoute){window.scrollTo(0,0)}else{window.scrollTo(0,keep)}
  lastRoute=r;
  if(r==='alerts'){/* 알림 화면을 열면 목록은 그대로 두고 배지만 유지 */}
}
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
window.addEventListener('hashchange',rerender);
$('#menuToggle').addEventListener('click',()=>{$('#side').classList.add('open');$('#scrim').classList.add('open')});
$('#scrim').addEventListener('click',closeMenu);
$('#bell').addEventListener('click',()=>{location.hash='#alerts'});
$('#fileInput').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)handleFiles(f)});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-sop],[data-analyze],[data-del],[data-open],[data-row],[data-filter],[data-goto],[data-read],[data-alert-analyze],[data-kp-analyze]');if(!t)return;
  const d=t.dataset;
  if(d.analyze){e.stopPropagation();pickKp={};location.hash='#analyze';setTimeout(()=>{document.querySelectorAll('input[name=pick]').forEach(c=>c.checked=c.value===d.analyze)},30);return}
  if(d.del){e.stopPropagation();const s=S.sops.find(x=>x.id===d.del);if(s){S.sops=S.sops.filter(x=>x.id!==d.del);openSop=null;save();rerender();toast(`${s.docNo}을(를) 목록에서 지웠습니다.`)}return}
  if(d.sop){openSop=openSop===d.sop?null:d.sop;rerender();if(openSop)setTimeout(()=>$('#sopDetail')?.scrollIntoView({behavior:'smooth',block:'start'}),30);return}
  if(d.open){S.current=d.open;save();fStatus='all';selRow=d.row!=null&&d.row!==''?Number(d.row):null;location.hash='#results';if(route()==='results')rerender();setTimeout(()=>$('#detail')?.scrollIntoView({block:'start'}),60);return}
  if(d.row!=null&&route()==='results'){selRow=Number(d.row);rerender();setTimeout(()=>$('#detail')?.scrollIntoView({behavior:'smooth',block:'start'}),30);return}
  if(d.filter){fStatus=d.filter;rerender();return}
  if(d.goto!==undefined){gotoSource(d.sent);return}
  if(d.read){const al=S.alerts.find(x=>x.id===d.read);al.read=true;save();rerender();return}
  if(d.alertAnalyze){const al=S.alerts.find(x=>S.sops.find(s=>s.id===d.alertAnalyze&&s.method===x.method));if(al){al.read=true;save()}pickKp={};location.hash='#analyze';setTimeout(()=>document.querySelectorAll('input[name=pick]').forEach(c=>c.checked=c.value===d.alertAnalyze),30);return}
  if(d.kpAnalyze){pickKp={};S.sops.forEach(s=>pickKp[s.id]=s.method===d.kpAnalyze?d.kpAnalyze:(pickKp[s.id]??s.method));location.hash='#analyze';setTimeout(()=>document.querySelectorAll('input[name=pick]').forEach(c=>{const s=S.sops.find(x=>x.id===c.value);c.checked=s.method===d.kpAnalyze}),30);return}
  const act=d.act;
  if(act==='pick')$('#fileInput').click();
  if(act==='run'){const ids=[...document.querySelectorAll('input[name=pick]:checked')].map(c=>c.value);doRun(ids)}
  if(act==='runAll'){location.hash='#analyze';setTimeout(()=>doRun(S.sops.filter(s=>s.method).map(s=>s.id)),50)}
  if(act==='xlsx'){const a=S.analyses.find(x=>x.id===S.current)||S.analyses[0];if(a)exportXlsx(a)}
  if(act==='print')window.print();
  if(act==='saveOpinion'){const a=S.analyses.find(x=>x.id===S.current);a.opinion=$('#opinion').value;save();toast('검토 의견을 저장했습니다.')}
  if(act==='approve'){const a=S.analyses.find(x=>x.id===S.current);a.opinion=$('#opinion').value;a.approved={by:me().name+' (QA)',at:nowStr()};save();rerender();toast('QA 검토 완료로 서명했습니다.')}
  if(act==='resetAsk'){$('#resetRow').innerHTML='<span class="small">업로드한 SOP와 분석 결과가 모두 지워집니다.</span><button class="btn" data-act="resetNo">취소</button><button class="btn primary" data-act="resetYes">초기화</button>'}
  if(act==='resetNo')rerender();
  if(act==='resetYes'){S=freshState();save();openSop=null;selRow=null;uploadLog=[];rerender();toast('시연 데이터로 되돌렸습니다.')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.kpFor!==undefined){pickKp[t.dataset.kpFor]=t.value}
  if(t.id==='anPick'||t.id==='repPick'){S.current=t.value;selRow=null;fStatus='all';save();rerender()}
  if(t.dataset.status){const al=S.alerts.find(x=>x.id===t.dataset.status);
    if(t.value==='검토 완료'&&me().role!=='QA'){toast('검토 완료 처리는 QA 승인자만 할 수 있습니다.');t.value=al.status;return}
    al.status=t.value;al.read=true;save();rerender();toast(`${al.item} 알림을 ‘${al.status}’로 바꿨습니다.`)}
  if(t.name==='user'){S.user=t.value;save();rerender();toast(`${me().name}(${me().label})로 전환했습니다.`)}
});
let qTimer;
document.addEventListener('input',e=>{
  if(e.target.id==='sopSearch'||e.target.id==='kpSearch'){const id=e.target.id,val=e.target.value,pos=e.target.selectionStart;if(id==='sopSearch')sopQuery=val;else kpQuery=val;
    clearTimeout(qTimer);qTimer=setTimeout(()=>{rerender();const el=document.getElementById(id);if(el){el.focus();el.setSelectionRange(pos,pos)}},180)}
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(ev==='drop'&&e.dataTransfer.files.length)handleFiles([...e.dataTransfer.files])}}));

/* SOPIA '시험법 문단 비교'에서 넘어온 입력을 받아 바로 분석한다 */
function takeHandoff(){
  let h=null;try{h=JSON.parse(localStorage.getItem('sopia-compare-handoff')||'null');localStorage.removeItem('sopia-compare-handoff')}catch(e){}
  if(!h||!h.text)return;
  const d=parseSop(h.text,'시험법 문단 비교 입력');
  if(/^UPLOAD-/.test(d.docNo))d.docNo='INPUT-'+d.docNo.slice(7);
  if(!/(?:제\s*목|문서\s*명)\s*[:：]/.test(h.text))d.title='시험법 문단 비교 입력';
  d.file='시험법 문단 비교 화면에서 입력'+(h.files&&h.files.length?` · 첨부 ${h.files.length}건`:'');
  d.history=[{rev:d.rev,date:today(),note:'시험법 문단 비교 화면에서 입력'}];
  if(h.demo){d.demo=true;if(h.title)d.title=h.title;d.file=h.fileName||'비교용 문서';d.history=[{rev:d.rev,date:today(),note:'발표 시연용 사전 등록 문서'}]}
  const kp=KP[h.method]?h.method:d.method;d.method=kp;
  S.sops.unshift(d);const an=runAnalysis(d.id,kp||null);an.source='compare';an.demo=!!h.demo;save();selRow=null;fStatus='all';
  if(location.hash!=='#results')history.replaceState(null,'','#results');
}
load();takeHandoff();rerender();
</script>
<button type="button" class="to-top" id="toTop" aria-label="맨 위로 이동" data-tip="맨 위로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
<script id="to-top-js">
/* 맨 위로 이동: 이 화면은 페이지 전체가 스크롤된다. 표·원문 칸 안쪽 스크롤도 함께 확인한다 */
(function(){
  var btn=document.getElementById('toTop');if(!btn)return;
  var SHOW_AT=300,GAP=12;
  function page(){return document.scrollingElement||document.documentElement}
  function innerScrollers(){return [].filter.call(document.querySelectorAll('#view .raw'),function(el){return el.getClientRects().length&&el.scrollHeight>el.clientHeight+1})}
  function update(){
    var show=page().scrollTop>=SHOW_AT;
    btn.classList.toggle('show',show);btn.tabIndex=show?0:-1;btn.setAttribute('aria-hidden',show?'false':'true');
    if(!show)return;
    /* 화면 아래쪽 버튼·입력칸과 겹치면 그 위로 올린다 */
    btn.style.bottom='';btn.classList.remove('yield');
    var r=btn.getBoundingClientRect(),vh=window.innerHeight,base=vh-r.bottom,boxes=[];
    document.querySelectorAll('#view .btn, #view button, #view select, #view textarea, #view input, #view .st, .toast').forEach(function(el){
      if(!el.getClientRects().length)return;var a=el.getBoundingClientRect();
      if(a.right>r.left-GAP&&a.left<r.right+GAP&&a.bottom>0&&a.top<vh)boxes.push(a)});
    function free(bottom){var top=vh-bottom-r.height,bot=vh-bottom;return boxes.every(function(a){return !(a.bottom>top-GAP/2&&a.top<bot+GAP/2)})}
    /* 기본 위치부터 위로 올려 가며 비어 있는 자리를 찾는다. 화면 아래쪽 45% 안에 없으면 잠시 비켜 준다 */
    var found=null;for(var b=base;b<=vh*0.45;b+=4){if(free(b)){found=b;break}}
    if(found===null)btn.classList.add('yield');else if(found!==base)btn.style.bottom=found+'px';
  }
  var ticking=false;function schedule(){if(!ticking){ticking=true;setTimeout(function(){ticking=false;update()},50)}}
  window.addEventListener('scroll',schedule,{passive:true});window.addEventListener('resize',schedule);window.addEventListener('hashchange',function(){setTimeout(schedule,60)});
  btn.addEventListener('click',function(){
    var smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'auto';
    window.scrollTo({top:0,behavior:smooth});innerScrollers().forEach(function(el){el.scrollTo({top:0,behavior:smooth})});btn.blur();
  });
  update();
})();
</script>
